<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 300" width="358" height="300" role="img" aria-labelledby="approval-flow-title approval-flow-desc" font-family="Heebo, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="approval-flow-title">איך הזמנה יוצאת לספק</title>
  <desc id="approval-flow-desc">הודעה מהמנהל הופכת לטיוטה, מחכה לאישור בטלגרם, ורק אז נשלחת לספק; הטיוטה נרשמת ביומן.</desc>
  <style>
    .ln{stroke:var(--axis);stroke-width:1.5;fill:none}
    .ln.opt{stroke-dasharray:5 4}
    .hd{fill:var(--axis)}
    .bx{fill:var(--tile);stroke:var(--axis);stroke-width:1}
    .bx.focus{stroke:var(--s1);stroke-width:2}
    .bx.store{fill:var(--surface);stroke-dasharray:4 3}
    .nm{fill:var(--ink);font-size:14px;font-weight:700}
    .sl{fill:var(--ink-2);font-size:11.5px}
    .tag{fill:var(--s1)}
    .tagt{fill:#ffffff;font-size:10px;font-weight:700}
  </style>
  <defs>
    <marker id="af-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hd"/></marker>
  </defs>
  <!-- connectors first, so boxes sit on top -->
  <line class="ln" x1="232" y1="60" x2="232" y2="88" marker-end="url(#af-arrow)"/>
  <line class="ln" x1="232" y1="140" x2="232" y2="168" marker-end="url(#af-arrow)"/>
  <line class="ln" x1="232" y1="220" x2="232" y2="248" marker-end="url(#af-arrow)"/>
  <line class="ln opt" x1="124" y1="116" x2="104" y2="116" marker-end="url(#af-arrow)"/>
  <!-- main column, right-aligned for a right-to-left reader -->
  <rect class="bx" x="124" y="12" width="216" height="48" rx="6"/>
  <text class="nm" x="324" y="34" direction="rtl" text-anchor="start">הודעה מהמנהל</text>
  <text class="sl" x="324" y="51" direction="rtl" text-anchor="start">בצ׳אט, במילים שלו</text>
  <rect class="bx focus" x="124" y="92" width="216" height="48" rx="6"/>
  <text class="nm" x="324" y="114" direction="rtl" text-anchor="start">הסוכן מכין טיוטה</text>
  <text class="sl" x="324" y="131" direction="rtl" text-anchor="start">כמות, מחיר, תאריך</text>
  <rect class="tag" x="132" y="100" width="44" height="16" rx="2"/>
  <text class="tagt" x="154" y="112" text-anchor="middle">מוקד</text>
  <rect class="bx" x="124" y="172" width="216" height="48" rx="6"/>
  <text class="nm" x="324" y="194" direction="rtl" text-anchor="start">אישור בטלגרם</text>
  <text class="sl" x="324" y="211" direction="rtl" text-anchor="start">לחיצה אחת, או שינוי</text>
  <rect class="bx" x="124" y="252" width="216" height="40" rx="6"/>
  <text class="nm" x="324" y="277" direction="rtl" text-anchor="start">נשלח לספק</text>
  <!-- side store -->
  <rect class="bx store" x="16" y="92" width="88" height="48" rx="6"/>
  <text class="nm" x="60" y="114" text-anchor="middle" style="font-size:13px">יומן</text>
  <text class="sl" x="60" y="131" text-anchor="middle">הזמנות</text>
</svg>
