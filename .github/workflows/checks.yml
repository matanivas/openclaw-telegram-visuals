name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: for f in skills/*/scripts/*.mjs; do node --check "$f"; done
      - name: Build the examples
        run: |
          for s in show-me phone-viz; do
            for spec in skills/$s/examples/*.json; do
              node skills/$s/scripts/build.mjs "$spec" "$RUNNER_TEMP/$s-$(basename "$spec" .json).html"
            done
          done
      - name: Render one page
        run: node skills/show-me/scripts/render.mjs "$RUNNER_TEMP/show-me-weekly-status.he.html" --theme light
