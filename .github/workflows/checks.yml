name: Bundle checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests
      - name: Install into a disposable workspace
        run: |
          mkdir -p "$RUNNER_TEMP/visuals-workspace"
          python scripts/install.py --workspace "$RUNNER_TEMP/visuals-workspace" --protocol --apply
          python scripts/setup-runtime.py --workspace "$RUNNER_TEMP/visuals-workspace"
          node "$RUNNER_TEMP/visuals-workspace/skills/telegram-visual-brief/runtime/node_modules/playwright/cli.js" install-deps chromium
      - run: python scripts/smoke.py --workspace "$RUNNER_TEMP/visuals-workspace"
